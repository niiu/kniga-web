# Порт снаружи:
#   ./deploy.sh
#   PORT=3000 ./deploy.sh
version: "3.8"
services:
  kniga:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      VITE_AUTH_ENABLED: "false"
      HOST: "0.0.0.0"
      PORT: "8080"
      NITRO_PORT: "8080"
      PGLITE_DATA_DIR: /data/pglite
    volumes:
      - kniga-data:/data
    restart: unless-stopped

volumes:
  kniga-data:
